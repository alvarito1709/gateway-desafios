# Snippet de Nginx: /etc/nginx/snippets/desafios.conf
# Se incluye dentro del server de especializate.bue.edu.ar:
#     include snippets/desafios.conf;
# (los location de prefijo más largo ganan sobre "location /" que va al gateway de :3000)

location = /aula/desafios {
    return 301 /aula/desafios/;
}

# Sin barra ni ruta en proxy_pass: Nginx reenvía la URI completa sin reescribirla
# (el gateway cuelga todo de BASE_PATH=/aula/desafios).
location /aula/desafios/ {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # TLS termina en el Application Gateway; la cookie de sesión es "secure".
    proxy_set_header X-Forwarded-Proto https;
}
