<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresá desde tu aula de Moodle — Especializate</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f1226; color: #e8e9f3; padding: 24px;
    }
    .card {
      max-width: 460px; width: 100%; background: #171a33;
      border: 1px solid #2a2e52; border-radius: 18px; padding: 34px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35); text-align: center;
    }
    .ic {
      width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 14px;
      display: grid; place-items: center; background: #22264a;
    }
    .ic svg { width: 28px; height: 28px; stroke: #8b93ff; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    h1 { font-size: 1.35rem; margin: 0 0 10px; }
    p { color: #b7bad6; line-height: 1.55; margin: 0 0 22px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
      background: #6d73ff; color: #fff; font-weight: 600; font-size: .98rem;
      padding: 12px 22px; border-radius: 10px; transition: background .15s;
    }
    .btn:hover { background: #5960f0; }
    .btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>
  <main class="card">
    <div class="ic">
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h1>Ingresá desde tu aula de Moodle</h1>
    <p>Para acceder a esta experiencia necesitás ingresar desde el curso correspondiente en Moodle.</p>
    <a class="btn" href="{{MOODLE_URL}}">
      Ir a Moodle
      <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </a>
  </main>
</body>
</html>
